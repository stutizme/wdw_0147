<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Shapes</title>
</head>
<body>

    <h1>Drawing Shapes Using SVG</h1>

    <svg width="400" height="250">

        <circle cx="100" cy="100" r="50"
        fill="blue" />

        <rect x="200" y="50" width="120" height="100"
        fill="green" />

    </svg>

</body>
</html>
