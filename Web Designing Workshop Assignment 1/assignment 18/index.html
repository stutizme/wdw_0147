
<!DOCTYPE html>
<html>
<head>
    <title>Advanced HTML Tables</title>
</head>
<body>

    <h1>Weekly Timetable</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Day</th>
            <th>9 AM - 10 AM</th>
            <th>10 AM - 11 AM</th>
            <th>11 AM - 12 PM</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td rowspan="2">Computer Lab</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>JavaScript</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td colspan="2">Web Development Workshop</td>
            <td>Maths</td>
        </tr>
    </table>

    <h2>Nested Table - Lab Schedule</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Department</th>
            <th>Lab Details</th>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>
                <table border="1" cellpadding="5">
                    <tr>
                        <th>Lab</th>
                        <th>Time</th>
                    </tr>
                    <tr>
                        <td>Web Development</td>
                        <td>10 AM</td>
                    </tr>
                    <tr>
                        <td>Programming</td>
                        <td>12 PM</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
