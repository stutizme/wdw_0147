<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Page</title>
</head>
<body>

    <header>
        <h1>ABC College</h1>
        <p>Student Admission Portal 2026</p>
    </header>

    <main>

        <section>
            <h2>Available Courses</h2>

            <table border="1">
                <caption>Course Information</caption>

                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Duration</th>
                        <th>Seats</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>4 Years</td>
                        <td>120</td>
                    </tr>

                    <tr>
                        <td>BCA</td>
                        <td>3 Years</td>
                        <td>60</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>Student Application Form</h2>

            <form id="admission-form">
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="name">Student Name:</label>
                    <input type="text" id="name" name="name" required>
                    <br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                    <br><br>

                    <label for="course">Course:</label>
                    <select id="course" name="course" required>
                        <option value="">Choose a course</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>
                    <br><br>

                    <label for="statement">
                        Statement (at least 20 characters):
                    </label>
                    <br>

                    <textarea id="statement" name="statement"
                    minlength="20" required></textarea>
                    <br><br>

                    <button type="submit">Apply</button>

                    <p id="status" role="status"
                    aria-live="polite"></p>

                </fieldset>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>

    <script>
        const form = document.getElementById("admission-form");
        const status = document.getElementById("status");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            if (!form.reportValidity()) {
                status.textContent = "Please correct the highlighted fields.";
                return;
            }

            const studentName = document.getElementById("name").value.trim();
            const selectedCourse = document.getElementById("course").value;

            if (!studentName) {
                status.textContent = "Please enter your name.";
                return;
            }

            status.textContent =
                "Demo: application details are valid for " +
                studentName + " (" + selectedCourse + ").";

            form.reset();
        });
    </script>

</body>
</html>
